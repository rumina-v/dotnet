[SERVICE]
    Flush              1
    Log_Level          warn
    Parsers_File       /fluent-bit/etc/parsers.conf
    storage.path       /fluent-bit/state/buffer
    storage.sync       normal
    storage.checksum   on

[INPUT]
    Name               tail
    Path               /logs/api.jsonl
    Parser             dotnet_json
    Tag                users.api
    DB                 /fluent-bit/state/tail.db
    Read_From_Head     on
    Refresh_Interval   1
    Skip_Long_Lines    on
    Buffer_Max_Size    1M
    storage.type       filesystem

[OUTPUT]
    Name               opensearch
    Match              users.api
    Host               opensearch
    Port               9200
    Index              user-registration-logs
    Suppress_Type_Name on
    Generate_ID        on
    Retry_Limit        no_limits
    storage.total_limit_size 100M
