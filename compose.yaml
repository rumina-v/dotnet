name: dotnet-users

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: user_registration
      POSTGRES_USER: user_registration
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_registration -d user_registration"]
      interval: 5s
      timeout: 5s
      retries: 12

  approvals-postgres:
    profiles: [microservices]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: approvals
      POSTGRES_USER: approvals
      POSTGRES_PASSWORD_FILE: /run/secrets/approvals_password
    ports:
      - "127.0.0.1:${APPROVALS_POSTGRES_PORT:-5434}:5432"
    volumes:
      - approvals_data:/var/lib/postgresql/data
    secrets:
      - approvals_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvals -d approvals"]
      interval: 5s
      timeout: 5s
      retries: 12

  opensearch:
    profiles: [observability]
    image: public.ecr.aws/opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s&filter_path=status'
          | grep -Eq '"status":"(green|yellow)"'
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  dashboards:
    profiles: [observability]
    image: public.ecr.aws/opensearchproject/opensearch-dashboards:3.9.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      NODE_OPTIONS: "--max-old-space-size=512"
    mem_limit: 1g
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  fluent-bit:
    profiles: [observability]
    image: fluent/fluent-bit:5.1.4
    mem_limit: 128m
    volumes:
      - ./observability/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./observability/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./local/logs:/logs:ro
      - fluent_bit_state:/fluent-bit/state
    depends_on:
      opensearch:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./local/postgres_password.txt
  approvals_password:
    file: ./local/approvals_password.txt

volumes:
  postgres_data:
  approvals_data:
  opensearch_data:
  fluent_bit_state:
